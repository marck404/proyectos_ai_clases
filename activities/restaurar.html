<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Restaurar fotos | Taller de IA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="page-header">
        <div>
          <p class="eyebrow">Actividad 3</p>
          <h1>Restaurar fotos</h1>
        </div>
        <a class="back-link" href="../index.html">← Volver</a>
      </header>

      <main class="showcase">
        <div class="student-grid">
          <article class="student-card">
            <div class="student-header">
              <h3>Alumno 1</h3>
              <span class="student-badge">Recuperación</span>
            </div>
            <p class="meta-text">Restauración de una imagen vieja con colores más vivos.</p>
            <div class="before-after" data-label="Antes / Después"></div>
          </article>

          <article class="student-card">
            <div class="student-header">
              <h3>Alumno 2</h3>
              <span class="student-badge">Detalle</span>
            </div>
            <p class="meta-text">Corrección de textura y mejora en rostro y fondo.</p>
            <div class="before-after" data-label="Antes / Después"></div>
          </article>

          <article class="student-card">
            <div class="student-header">
              <h3>Alumno 3</h3>
              <span class="student-badge">Color</span>
            </div>
            <p class="meta-text">Revisión de fotografía para recuperar claridad y contraste.</p>
            <div class="before-after" data-label="Antes / Después"></div>
          </article>
        </div>
      </main>
    </div>

    <script src="../script.js"></script>
  </body>
</html>
