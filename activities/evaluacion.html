<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reto Web: HTML, CSS, JavaScript e IA</title>
<style>
  :root { --bg:#12122b; --card:#1e1e45; --acc:#7c5cff; --ok:#2ecc71; --bad:#ff5c7a; --txt:#f2f2ff; --mut:#a9a9d6; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Segoe UI",system-ui,sans-serif; background:linear-gradient(135deg,#12122b,#2a1b5e); color:var(--txt); min-height:100vh; display:flex; justify-content:center; padding:20px; }
  #app { width:100%; max-width:760px; }
  .back-link { display:inline-flex; margin:0 0 12px; padding:8px 12px; border:1px solid #5555a0; border-radius:10px; color:var(--txt); text-decoration:none; }
  .back-link:hover { background:#2e2e66; }
  .back-link:focus-visible { outline:2px solid #38bdf8; outline-offset:3px; }
  h1 { text-align:center; margin:10px 0 4px; }
  .sub { text-align:center; color:var(--mut); margin-bottom:20px; }
  .card { background:var(--card); border-radius:18px; padding:24px; box-shadow:0 10px 30px #0006; }
  .bar { height:10px; background:#0004; border-radius:6px; overflow:hidden; margin-bottom:8px; }
  .bar div { height:100%; width:0; background:linear-gradient(90deg,var(--acc),#38bdf8); transition:width .4s; }
  .meta { display:flex; justify-content:space-between; color:var(--mut); font-size:.9rem; margin-bottom:14px; }
  .tag { display:inline-block; background:var(--acc); border-radius:20px; padding:2px 12px; font-size:.8rem; margin-bottom:10px; }
  h2 { margin:6px 0 16px; line-height:1.3; }
  button { font:inherit; cursor:pointer; border:0; border-radius:12px; padding:12px 18px; color:var(--txt); background:#2e2e66; transition:.15s; }
  button:hover:not(:disabled) { background:#3d3d85; transform:translateY(-2px); }
  button:disabled { cursor:default; opacity:.8; }
  .opt { display:block; width:100%; text-align:left; margin:8px 0; }
  .primary { background:var(--acc); }
  .primary:hover:not(:disabled) { background:#917aff; }
  .ok { background:var(--ok)!important; color:#062; }
  .bad { background:var(--bad)!important; }
  .fb { margin-top:14px; padding:12px; border-radius:12px; background:#0004; min-height:20px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .chip { background:#2e2e66; border-radius:10px; padding:10px 14px; cursor:grab; user-select:none; }
  .chip.sel { outline:2px solid var(--acc); }
  .zone { min-height:44px; border:2px dashed #5555a0; border-radius:12px; padding:8px; margin:8px 0; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .zone.over { background:#7c5cff33; }
  .zone small { color:var(--mut); }
  input[type=text] { font:inherit; padding:12px; border-radius:12px; border:2px solid #5555a0; background:#0004; color:var(--txt); width:100%; }
  .pair { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .pair button.sel { outline:2px solid var(--acc); }
  .pair button.done { background:var(--ok); color:#062; }
  .ctl { margin-top:16px; display:flex; justify-content:flex-end; gap:10px; }
  .big { font-size:4rem; text-align:center; margin:10px 0; }
  .demo { background:#0004; border-radius:12px; padding:16px; text-align:center; margin:10px 0; }
  .demo button { font-size:1rem; }
  .code { background:#0006; padding:14px; border-radius:12px; font-family:Consolas,monospace; white-space:pre-wrap; margin:10px 0; }
  .hidden { display:none; }
  .shake { animation:shake .4s; }
  @keyframes shake { 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  @media (max-width:520px) {
    body { padding:12px; }
    .card { padding:18px; }
    .pair { grid-template-columns:1fr; }
    .ctl { flex-wrap:wrap; }
  }
</style>
</head>
<body>
<div id="app">
  <a class="back-link" href="../index.html">← Volver al taller</a>
  <h1>🎮 Reto Web con IA</h1>
  <div class="sub">HTML 🦴 · CSS 👕 · JavaScript 🧠 · IA 🤖</div>
  <div class="card" id="card"></div>
</div>

<script>
// ---------- Banco de preguntas ----------
const QUESTIONS = [
  { type:"choice", tag:"HTML", q:"¿Qué significa HTML?",
    opts:["HyperText Markup Language","High Tech Modern Language","Home Tool Make Links","Hyper Transfer Machine Logic"], ans:0,
    exp:"HyperText Markup Language: el lenguaje para crear la estructura de una página." },

  { type:"match", tag:"Los tres trabajan juntos", q:"Une cada tecnología con su analogía.",
    pairs:[["HTML","🦴 Esqueleto"],["CSS","👕 Piel / ropa"],["JavaScript","🧠 Cerebro"]],
    exp:"HTML = estructura, CSS = apariencia, JavaScript = comportamiento." },

  { type:"truefalse", tag:"CSS", q:"CSS sirve para decidir cómo se ve la página: colores, tamaños, tipografías y fondos.", ans:true,
    exp:"¡Correcto! CSS = Cascading Style Sheets." },

  { type:"fill", tag:"JavaScript", q:"HTML dice qué hay, CSS dice cómo se ve y ______ dice qué ocurre cuando hacemos clic.",
    answers:["javascript","js"], hint:"Es el cerebro de la página.",
    exp:"JavaScript es el que da comportamiento." },

  { type:"classify", tag:"Clasifica", q:"Arrastra (o toca y luego toca la caja) cada elemento a su lenguaje.",
    cats:["HTML","CSS","JavaScript"],
    items:[["Un título <h1>","HTML"],["Color de fondo azul","CSS"],["Contador que sube al hacer clic","JavaScript"],["Una imagen <img>","HTML"],["Tipo de letra","CSS"],["Mostrar un mensaje al presionar un botón","JavaScript"]],
    exp:"Estructura → HTML, apariencia → CSS, comportamiento → JavaScript." },

  { type:"order", tag:"Flujo de trabajo", q:"Ordena el flujo para crear tu página con IA (usa ⬆️ y ⬇️).",
    steps:["💡 Idea","🤖 Pedirle ayuda a la IA","💻 Copiar el código","🌐 Abrirlo en el navegador","🔧 Pedir mejoras y personalizar"],
    exp:"Idea → IA → Código → Página web → Mejoras." },

  { type:"demo", tag:"Interactivo", q:"Este botón tiene HTML y CSS, pero le falta JavaScript. ¿Qué pasa al hacer clic?",
    opts:["Nada: sin JavaScript no hay comportamiento","Cambia de color solo","Muestra un mensaje solo"], ans:0,
    exp:"El HTML crea el botón y el CSS lo decora, pero JavaScript decide qué ocurre al hacer clic." },

  { type:"multi", tag:"IA", q:"Selecciona TODO lo que la IA puede hacer como asistente de programación:",
    opts:["Crear código HTML","Explicar qué significa cada parte","Encontrar errores","Decidir por ti qué quieres construir"], correct:[0,1,2],
    exp:"La IA escribe el código, pero tú decides qué quieres construir." },

  { type:"prompt", tag:"Buen prompt", q:"Arma el mejor prompt: toca las piezas que lo hacen mejor. (Elige las 3 mejores)",
    base:"Crea una página web…",
    opts:["tipo blog personal para un estudiante de secundaria","bonita","que use HTML, CSS y JavaScript","algo así como lo que sea","con un menú, sección sobre mí y un botón que muestre un mensaje"],
    correct:[0,2,4], need:3,
    exp:"Mientras mejor expliquemos nuestra idea, más fácil será para la IA ayudarnos." },

  { type:"choice", tag:"Proceso", q:"Crear con IA es crear → probar → mejorar. ¿Cuándo conviene pedir mejoras?",
    opts:["Nunca: hay que aceptar el primer resultado","Las veces necesarias, probando y ajustando hasta lograr lo que buscamos","Solo una vez, aunque el resultado no sea el esperado"], ans:1,
    exp:"No tenemos que aceptar el primer resultado. Construimos poco a poco." },

  { type:"code", tag:"Código", q:"Completa el código: ¿qué etiqueta HTML crea un botón?",
    code:"<____>¡Haz clic!</____>", answers:["button"],
    hint:"Empieza con b.", exp:"<button> crea un botón." },

  { type:"truefalse", tag:"Objetivo", q:"La meta principal del curso es solo copiar y pegar código que funcione.", ans:false,
    exp:"No: queremos pensar, explicar, entender, probar y mejorar. La IA es la herramienta; las decisiones son tuyas." }
];

// ---------- Estado ----------
let idx = 0, score = 0, results = [], answered = false;
const card = document.getElementById("card");
const POINTS = 10;
const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const norm = s => s.toLowerCase().trim().replace(/[<>\/\s]/g,"");
const shuffle = a => { a = [...a]; for (let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];} return a; };

function start() {
  idx = 0; score = 0; results = [];
  card.innerHTML = `
    <div class="big">🚀</div>
    <h2 style="text-align:center">¿Cuánto sabes de HTML, CSS, JavaScript e IA?</h2>
    <p style="text-align:center;color:var(--mut)">${QUESTIONS.length} retos de distintos tipos: opción múltiple, unir, arrastrar, ordenar, completar y más. Cada reto vale ${POINTS} puntos.</p>
    <div class="ctl" style="justify-content:center"><button class="primary" onclick="show()">¡Empezar!</button></div>`;
}

function show() {
  answered = false;
  const Q = QUESTIONS[idx];
  card.innerHTML = `
    <div class="bar"><div style="width:${idx/QUESTIONS.length*100}%"></div></div>
    <div class="meta"><span>Pregunta ${idx+1} de ${QUESTIONS.length}</span><span>⭐ ${score} pts</span></div>
    <span class="tag">${esc(Q.tag)}</span>
    <h2>${esc(Q.q)}</h2>
    <div id="body"></div>
    <div class="fb hidden" id="fb"></div>
    <div class="ctl"><button class="primary hidden" id="next" onclick="next()">${idx===QUESTIONS.length-1?"Ver resultado":"Siguiente ➜"}</button></div>`;
  RENDER[Q.type](Q, document.getElementById("body"));
}

// finish(fraction 0..1) registra puntaje
function finish(Q, fraction, msg) {
  if (answered) return;
  answered = true;
  const pts = Math.round(POINTS * fraction);
  score += pts; results.push({q:Q.q, pts});
  const fb = document.getElementById("fb");
  fb.classList.remove("hidden");
  const icon = fraction===1 ? "✅ ¡Correcto!" : fraction>0 ? "🟡 Casi." : "❌ Incorrecto.";
  fb.innerHTML = `<b>${icon} +${pts} pts</b> ${msg?esc(msg)+"<br>":""}💡 ${esc(Q.exp)}`;
  document.getElementById("next").classList.remove("hidden");
  document.querySelector(".meta span:last-child").textContent = `⭐ ${score} pts`;
}
function next() { idx++; idx < QUESTIONS.length ? show() : end(); }

// ---------- Renderizadores ----------
const RENDER = {
  choice(Q, el) {
    shuffle(Q.opts.map((t,i)=>[t,i])).forEach(([t,i]) => {
      const b = document.createElement("button"); b.className="opt"; b.textContent=t;
      b.onclick = () => {
        el.querySelectorAll("button").forEach(x=>x.disabled=true);
        b.classList.add(i===Q.ans?"ok":"bad");
        if (i!==Q.ans) [...el.children].find(x=>x.textContent===Q.opts[Q.ans]).classList.add("ok");
        finish(Q, i===Q.ans?1:0);
      };
      el.appendChild(b);
    });
  },

  truefalse(Q, el) {
    el.innerHTML = `<div class="row"><button class="opt" data-v="true">✔️ Verdadero</button><button class="opt" data-v="false">✖️ Falso</button></div>`;
    el.querySelectorAll("button").forEach(b => b.onclick = () => {
      const v = b.dataset.v==="true";
      el.querySelectorAll("button").forEach(x=>x.disabled=true);
      b.classList.add(v===Q.ans?"ok":"bad");
      finish(Q, v===Q.ans?1:0);
    });
  },

  fill(Q, el) { textAnswer(Q, el); },
  code(Q, el) {
    el.innerHTML = `<div class="code">${esc(Q.code)}</div>`;
    textAnswer(Q, el, true);
  },

  match(Q, el) {
    const left = Q.pairs.map((p,i)=>[p[0],i]), right = shuffle(Q.pairs.map((p,i)=>[p[1],i]));
    el.innerHTML = `<div class="pair"><div id="L"></div><div id="R"></div></div><p style="color:var(--mut)">Toca uno de la izquierda y luego su pareja.</p>`;
    let sel = null, hits = 0, errors = 0;
    const L = el.querySelector("#L"), R = el.querySelector("#R");
    left.forEach(([t,i]) => { const b=document.createElement("button"); b.className="opt"; b.textContent=t; b.dataset.i=i;
      b.onclick=()=>{ if(b.classList.contains("done")||answered) return; L.querySelectorAll("button").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); sel=b; }; L.appendChild(b); });
    right.forEach(([t,i]) => { const b=document.createElement("button"); b.className="opt"; b.textContent=t; b.dataset.i=i;
      b.onclick=()=>{
        if(!sel||b.classList.contains("done")||answered) return;
        if(sel.dataset.i===b.dataset.i){ sel.classList.remove("sel"); sel.classList.add("done"); b.classList.add("done"); hits++; sel=null;
          if(hits===Q.pairs.length) finish(Q, Math.max(0,1-errors*0.25), errors?`Tuviste ${errors} error(es).`:"");
        } else { errors++; b.classList.add("shake"); setTimeout(()=>b.classList.remove("shake"),400); }
      }; R.appendChild(b); });
  },

  classify(Q, el) {
    el.innerHTML = `<div class="zone" id="pool"></div><div id="cats"></div><div class="ctl"><button class="primary" id="chk">Comprobar</button></div>`;
    const pool = el.querySelector("#pool"), cats = el.querySelector("#cats");
    let picked = null;
    const zones = {};
    Q.cats.forEach(c => { const z=document.createElement("div"); z.className="zone"; z.innerHTML=`<small>${c}:</small>`; z.dataset.cat=c; zones[c]=z; cats.appendChild(z);
      z.ondragover=e=>{e.preventDefault();z.classList.add("over");}; z.ondragleave=()=>z.classList.remove("over");
      z.ondrop=e=>{e.preventDefault();z.classList.remove("over"); if(picked) z.appendChild(picked); };
      z.onclick=()=>{ if(picked&&!answered){ z.appendChild(picked); picked.classList.remove("sel"); picked=null; } }; });
    pool.ondragover=e=>e.preventDefault(); pool.ondrop=e=>{e.preventDefault(); if(picked) pool.appendChild(picked);};
    shuffle(Q.items).forEach(([t,c]) => { const d=document.createElement("div"); d.className="chip"; d.textContent=t; d.draggable=true; d.dataset.cat=c;
      d.ondragstart=()=>{picked=d;}; 
      d.onclick=e=>{ e.stopPropagation(); if(answered) return; if(picked) picked.classList.remove("sel"); picked=d; d.classList.add("sel"); };
      pool.appendChild(d); });
    el.querySelector("#chk").onclick = () => {
      if (answered) return;
      let ok=0; const chips=[...el.querySelectorAll(".chip")];
      chips.forEach(ch => { const inCat = ch.parentElement.dataset.cat; if(inCat===ch.dataset.cat){ ok++; ch.style.background="var(--ok)"; ch.style.color="#062"; } else { ch.style.background="var(--bad)"; } ch.draggable=false; });
      finish(Q, ok/Q.items.length, `Acertaste ${ok} de ${Q.items.length}.`);
    };
  },

  order(Q, el) {
    let list = shuffle(Q.steps.map((t,i)=>[t,i]));
    if (list.every(([,i],k)=>i===k)) list.reverse();
    el.innerHTML = `<div id="ol"></div><div class="ctl"><button class="primary" id="chk">Comprobar</button></div>`;
    const ol = el.querySelector("#ol");
    const draw = () => { ol.innerHTML=""; list.forEach(([t],k)=>{
      const r=document.createElement("div"); r.className="row"; r.style.margin="6px 0";
      r.innerHTML=`<span style="flex:1" class="chip">${k+1}. ${esc(t)}</span><button>⬆️</button><button>⬇️</button>`;
      const [up,down]=r.querySelectorAll("button");
      up.onclick=()=>{ if(!answered&&k>0){[list[k-1],list[k]]=[list[k],list[k-1]];draw();} };
      down.onclick=()=>{ if(!answered&&k<list.length-1){[list[k+1],list[k]]=[list[k],list[k+1]];draw();} };
      ol.appendChild(r); }); };
    draw();
    el.querySelector("#chk").onclick = () => {
      if (answered) return;
      const ok = list.filter(([,i],k)=>i===k).length;
      [...ol.querySelectorAll(".chip")].forEach((c,k)=>{ c.style.background = list[k][1]===k?"var(--ok)":"var(--bad)"; c.style.color = list[k][1]===k?"#062":""; });
      finish(Q, ok/list.length, `${ok} de ${list.length} en su lugar.`);
    };
  },

  demo(Q, el) {
    el.innerHTML = `<div class="demo"><button id="magic" style="background:linear-gradient(90deg,#ff7e5f,#feb47b);font-size:1.2rem;padding:16px 28px">¡Haz clic!</button><p style="color:var(--mut)">Pruébalo 👆</p></div><div id="opts"></div>`;
    el.querySelector("#magic").onclick = e => { e.target.classList.add("shake"); setTimeout(()=>e.target.classList.remove("shake"),400); };
    RENDER.choice(Q, el.querySelector("#opts"));
  },

  multi(Q, el) {
    const sel = new Set();
    const wrap = document.createElement("div"); el.appendChild(wrap);
    Q.opts.forEach((t,i)=>{ const b=document.createElement("button"); b.className="opt"; b.textContent="☐ "+t;
      b.onclick=()=>{ if(answered)return; sel.has(i)?sel.delete(i):sel.add(i); b.textContent=(sel.has(i)?"☑ ":"☐ ")+t; b.classList.toggle("sel",sel.has(i)); b.style.outline=sel.has(i)?"2px solid var(--acc)":""; };
      wrap.appendChild(b); });
    const c=document.createElement("div"); c.className="ctl"; c.innerHTML='<button class="primary">Comprobar</button>'; el.appendChild(c);
    c.firstChild.onclick=()=>{
      if(answered)return;
      let good=0; Q.opts.forEach((_,i)=>{ const should=Q.correct.includes(i), chose=sel.has(i); if(should===chose) good++;
        if(should) wrap.children[i].classList.add("ok");
        else if(chose) wrap.children[i].classList.add("bad"); });
      wrap.querySelectorAll("button").forEach(b=>b.disabled=true);
      finish(Q, good===Q.opts.length?1:Math.max(0,(good-1)/Q.opts.length)*0.5);
    };
  },

  prompt(Q, el) {
    const sel = new Set();
    el.innerHTML = `<div class="code" id="pv">${esc(Q.base)}</div><div id="w"></div><div class="ctl"><button class="primary">Comprobar</button></div>`;
    const w = el.querySelector("#w"), pv = el.querySelector("#pv");
    const upd = () => pv.textContent = Q.base + " " + [...sel].sort().map(i=>Q.opts[i]).join(", ");
    Q.opts.forEach((t,i)=>{ const b=document.createElement("button"); b.className="opt"; b.textContent=t;
      b.onclick=()=>{ if(answered)return; if(sel.has(i)) sel.delete(i); else sel.add(i); b.style.outline=sel.has(i)?"2px solid var(--acc)":""; upd(); };
      w.appendChild(b); });
    el.querySelector(".ctl button").onclick=()=>{
      if(answered)return;
      const hit=[...sel].filter(i=>Q.correct.includes(i)).length, wrong=sel.size-hit;
      Q.opts.forEach((_,i)=>{ if(Q.correct.includes(i)) w.children[i].classList.add("ok"); else if(sel.has(i)) w.children[i].classList.add("bad"); });
      w.querySelectorAll("button").forEach(b=>b.disabled=true);
      finish(Q, Math.max(0,(hit-wrong)/Q.need));
    };
  },

};

function textAnswer(Q, el, noMargin) {
  el.insertAdjacentHTML("beforeend", `<input type="text" id="ti" placeholder="Escribe tu respuesta…" autocomplete="off"><div class="ctl"><button id="hint">💡 Pista</button><button class="primary" id="go">Responder</button></div>`);
  const ti = el.querySelector("#ti"); let hinted = false;
  el.querySelector("#hint").onclick = () => { hinted = true; const f=document.getElementById("fb"); f.classList.remove("hidden"); f.textContent="💡 "+Q.hint; };
  const go = () => {
    if (answered || !ti.value.trim()) return;
    const ok = Q.answers.includes(norm(ti.value));
    ti.disabled = true; ti.style.borderColor = ok?"var(--ok)":"var(--bad)";
    finish(Q, ok ? (hinted?0.5:1) : 0, ok ? (hinted?"(usaste la pista, mitad de puntos) ":"") : `Respuesta: ${Q.answers[0]}. `);
  };
  el.querySelector("#go").onclick = go;
  ti.onkeydown = e => { if (e.key==="Enter") go(); };
  ti.focus();
}

function end() {
  const max = QUESTIONS.length*POINTS, pct = Math.round(score/max*100);
  const [emoji, title] = pct>=90 ? ["🏆","¡Maestro/a de la web!"] : pct>=70 ? ["🚀","¡Muy buen trabajo!"] : pct>=50 ? ["👍","¡Vas bien, sigue practicando!"] : ["🌱","¡Buen comienzo, inténtalo otra vez!"];
  card.innerHTML = `
    <div class="bar"><div style="width:100%"></div></div>
    <div class="big">${emoji}</div>
    <h2 style="text-align:center">${title}</h2>
    <p style="text-align:center;font-size:2rem;margin:0">${score} / ${max} puntos (${pct}%)</p>
    <div style="margin:16px 0">${results.map((r,i)=>`<div class="meta" style="margin:4px 0"><span>${i+1}. ${esc(r.q.slice(0,55))}${r.q.length>55?"…":""}</span><span>${r.pts===POINTS?"✅":r.pts>0?"🟡":"❌"} ${r.pts}</span></div>`).join("")}</div>
    <p style="text-align:center;color:var(--mut)">Recuerda: la IA escribe el código, tú decides qué quieres construir. 💡</p>
    <div class="ctl" style="justify-content:center"><button class="primary" onclick="start()">🔄 Jugar de nuevo</button></div>`;
}

start();
</script>
</body>
</html>
